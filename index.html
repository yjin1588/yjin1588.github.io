<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>팀별 미션 뽑기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 32px;
    }

    .description {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .button-area {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #222;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .teams {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .team {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
    }

    .team-title {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid #eee;
    }

    .mission-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mission {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: #f7f7f7;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.5;
    }

    .mission-number {
      flex: 0 0 auto;
      min-width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #333;
      color: white;
      border-radius: 50%;
      font-size: 13px;
      font-weight: bold;
    }

    .mission-text {
      flex: 1;
      word-break: keep-all;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 12px;
      }

      h1 {
        font-size: 26px;
      }

      .teams {
        grid-template-columns: 1fr;
      }

      .team {
        padding: 18px;
      }

      .mission {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎯 팀별 미션 뽑기</h1>

    <div class="description">
      각 팀은 8개의 미션을 뽑습니다!<br>
      한 팀 안에서는 같은 미션이 중복되지 않습니다.<br>
      단, 팀과 팀 사이에서는 같은 미션이 나올 수 있습니다.
    </div>

    <div class="button-area">
      <button onclick="drawMissions()">🎲 미션 다시 뽑기</button>
    </div>

    <div class="teams">

      <div class="team">
        <div class="team-title">🟥 1팀</div>
        <div class="mission-list" id="team1"></div>
      </div>

      <div class="team">
        <div class="team-title">🟦 2팀</div>
        <div class="mission-list" id="team2"></div>
      </div>

      <div class="team">
        <div class="team-title">🟩 3팀</div>
        <div class="mission-list" id="team3"></div>
      </div>

      <div class="team">
        <div class="team-title">🟨 4팀</div>
        <div class="mission-list" id="team4"></div>
      </div>

    </div>
  </div>


  <script>

    // 총 22개의 미션
    const missions = [
      "1. 시 1편 외워 오기 — 「너에게 묻는다」 (안도현). 1명이 전체 시 다 외워오기",
      "2. 「너구리가 살고 있어요」 표지판",
      "3. 포돌이 & 포순이",
      "4. 주황색 지붕 위 빨간색 앉아있는 사람 조형물",
      "5. 일렬로 배치된 검은색 하이라이트 조명의 개수는?",
      "6. 미끄럼틀 타는 것 동영상 찍어오기 — 다같이",
      "7. 자전거 탑승금지 빨간색 표지판",
      "8. 「새말전」 정자에서 팀원 다 같이 사진 찍기",
      "9. 「웃는 네 모습 참 예쁘다」 푯말",
      "10. 서울 무료 공공 와이파이 표지판",
      "11. 시계탑 사진 찍어오기",
      "12. 「봄날의 꽃처럼 활짝 피어라」 푯말",
      "13. 「걱정마 다 잘 될거야」 푯말",
      "14. 「남들과 비교하지마 너는 너 자체로 소중해」 푯말",
      "15. 분홍색 꽃 찾아서 사진 찍어오기",
      "16. 나무 사이로 하늘이 보이는 사진 찍어오기",
      "17. 카페 앞에서 인증샷 찍어오기",
      "18. 벤치에 팀원 전원이 앉아서 사진 찍기",
      "19. 팀원 전원이 5초 동안 같은 포즈를 취하는 영상 찍기",
      "20. 미끄럼틀 — 팀원 전원이 몸으로 하트를 만들어 사진 찍기",
      "21. 「괜찮아 지금처럼만 하면 돼」 푯말",
      "22. 「분명 좋은 일이 생길거야」 푯말"
    ];


    const teamCount = 4;
    const missionsPerTeam = 8;


    function drawMissions() {

      for (let team = 1; team <= teamCount; team++) {

        const teamElement =
          document.getElementById(`team${team}`);

        teamElement.innerHTML = "";


        // ⭐ 현재 팀에서 이미 뽑은 미션 번호를 저장
        // ⭐ 팀이 바뀌면 새로 만들어지므로 팀 간 중복은 허용됨
        const selectedIndices = [];


        for (let i = 0; i < missionsPerTeam; i++) {

          let randomIndex;


          // ⭐ 현재 팀에서 이미 뽑은 미션이면 다시 뽑기
          do {

            randomIndex =
              Math.floor(Math.random() * missions.length);

          } while (selectedIndices.includes(randomIndex));


          // ⭐ 현재 팀에서 뽑은 미션 기록
          selectedIndices.push(randomIndex);


          const missionText =
            missions[randomIndex];


          const missionElement =
            document.createElement("div");

          missionElement.className = "mission";


          missionElement.innerHTML = `
            <div class="mission-number">
              ${i + 1}
            </div>

            <div class="mission-text">
              ${missionText}
            </div>
          `;


          teamElement.appendChild(missionElement);
        }
      }
    }


    // 페이지를 열었을 때 자동으로 미션 뽑기
    drawMissions();

  </script>

</body>
</html>
